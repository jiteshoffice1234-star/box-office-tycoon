<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FF6B6B" />
    <meta name="description" content="Build your movie studio empire in this addictive tycoon game" />
    <title>Box Office Tycoon</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem('box-office-tycoon-theme') === 'dark' ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
